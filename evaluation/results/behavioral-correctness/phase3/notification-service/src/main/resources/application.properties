spring.application.name=notification
# Enable H2 Console so you can view the DB in your browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Database Connection Settings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
# Show SQL queries in the console log
spring.jpa.show-sql=true
# Services
server.port=${SERVER_PORT:8085}
# External Services Base URLs

services.location.url=${LOCATION_URL:http://localhost:8081}

services.customer.url=${CUSTOMER_URL:http://localhost:8082}

services.cargo.url=${CARGO_URL:http://localhost:8083}

services.route-planning.url=${ROUTE_PLANNING_URL:http://localhost:8084}

# OpenAPI / Swagger UI Settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.example.notification.controller

